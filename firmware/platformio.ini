; ═══════════════════════════════════════════════════════════════════
;  Ryby LED — ESP32-S3 N16R8 (16MB Flash / 8MB OPI PSRAM)
;  DEV: v262 — Arduino variant include-path fix; pioarduino 55.03.38-1
;
;  Struktura projektu:
;    boards/
;      esp32-s3-n16r8.json   ← własna definicja płytki (N16R8)
;    platformio.ini
;    partitions.csv
;    sdkconfig.defaults
;    src/
;      Ryby_LED_fi_S3.cpp
;      terminal_html.h        ← nagłówek PROGMEM HTML
;      terminal_html.cpp      ← dane PROGMEM HTML
; ═══════════════════════════════════════════════════════════════════

[platformio]
; Domyślnie tylko OTA — przycisk Upload w VSCode wgrywa bezprzewodowo.
; Żeby wgrać przez USB zmień na: 
;default_envs = esp32-s3-n16r8
default_envs = esp32-s3-n16r8-ota

; ── Wspólne ustawienia dla obu środowisk ─────────────────────────
[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-n16r8          ; własna definicja z boards/esp32-s3-n16r8.json
framework = arduino

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/variants/esp32s3
    -I src
    ; ↑ FIX: PlatformIO LDF w trybie "chain" skanuje pliki src/ w kontekście
    ;   kompilacji bibliotek (OneWire itp.), gdzie ścieżka src/ NIE jest
    ;   domyślnie dodawana. Efekt: "OneWire.cpp:7921: terminal_html.h not found"
    ;   mimo że sam Ryby_LED_fi_S3.cpp.o kompiluje się bez błędu.
    ;   -I src sprawia że src/ jest widoczny GLOBALNIE (we wszystkich TU).
    ;
    ; UWAGA (2026-08-04): -DCORE_DEBUG_LEVEL=0 był tu testowany jako
    ; diagnostyka dla błędu linkera "undefined reference to __wrap_log_printf"
    ; (patrz RYBY_PLAN_FLASH_FREEZE.md / historia sesji). NIE pomógł —
    ; błąd tylko przesunął się z AsyncTCP.cpp.o na chip-debug-report.cpp.o,
    ; co potwierdza że to twardy brak implementacji __wrap_log_printf
    ; w tej wersji frameworka (-Wl,--wrap=log_printf ustawione globalnie,
    ; bez odpowiadającej funkcji __wrap_log_printf). Usunięty — patrz
    ; docelowe rozwiązanie: własny stub __wrap_log_printf w src/.

; UWAGA: board_build.esp-idf.sdkconfig_path działa TYLKO dla framework = espidf.
; Przy framework = arduino (jak tutaj) ta opcja jest po cichu ignorowana —
; sdkconfig.defaults leżał bezczynnie, mimo że projekt się kompilował.
; pioarduino ma dla przypadku "Arduino + własne opcje ESP-IDF" osobny mechanizm:
; custom_sdkconfig, który uruchamia tzw. Hybrid Mode (przebudowa bibliotek
; ESP-IDF ze zmienionymi ustawieniami). Pierwszy build po tej zmianie będzie
; znacznie dłuższy (przebudowa od zera), kolejne — normalnie, dzięki cache.
; Potwierdzenie działania: szukaj w logu builda linii "*** Add "custom_sdkconfig" settings ***"
;
; UWAGA (2026-08-08): CONFIG_LWIP_DHCP_GET_NTP_SRV=n — dodane jako fix dla
; PANIC/CRASH w lwIP (sntp/udp_input assert), patrz
; docs/PLAN_WDROZENIOWY_lwip_sntp_crash.md sekcja 5. Domyślny sdkconfig frameworka
; (ciągnięty "przy okazji" przez wbudowaną, nieużywaną obsługę Matter) ma
; CONFIG_LWIP_TCPIP_CORE_LOCKING=y + CONFIG_LWIP_CHECK_THREAD_SAFETY=y +
; CONFIG_LWIP_DHCP_GET_NTP_SRV=y. Ta ostatnia opcja powoduje, że stos
; sieciowy SAM, autonomicznie, restartuje klienta SNTP za każdym razem gdy
; DHCP poda serwer NTP (opcja 42) — z kontekstu taska DHCP/netif, poza
; kontrolą aplikacji. To koliduje z hostByName()/TLS w tgTask (odświeżanie
; tokena Firebase) i produkuje rzadki assert "Required to lock TCPIP core
; functionality!" w sntp_stop/sntp_setoperatingmode. Projekt i tak podaje
; serwery NTP jawnie w configTzTime() (pool.ntp.org, time.nist.gov), więc
; serwer NTP z DHCP nigdy nie jest używany — wyłączenie tej opcji usuwa
; trigger u źródła, bez zmiany zachowania aplikacji.
; UWAGA (2026-08-11): CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y + CONFIG_SPIRAM_RODATA=y
; — fix dla WDT_TASK (task=IDLE0, pc=0x4037EFCF) w log_combined.txt, 3x/mies.
; Root cause: zapis/erase LittleFS (logToFile 8KB, histSavePending) na Core 0
; blokuje sprzętowo dostęp do flash-cache na OBU rdzeniach (procesor nie może
; pobierać stamtąd instrukcji), mimo że te operacje już są na tgTask +
; ręcznie karmią WDT między krokami (v33g/v61) — to nie pomaga, bo w oknie
; blokady CPU nie wykonuje żadnego kodu, więc nie ma jak "obejść" tego
; z poziomu aplikacji. Fix: kod + rodata wykonują się z PSRAM (OPI, 8MB —
; N16R8 ma to fizycznie), więc flash-cache stall przestaje zatrzymywać CPU.
; Koszt: PSRAM wolniejsza niż flash-cache -> obserwować pod kątem
; timing-owych regresji (PWM/ledc, ISR) po wgraniu.
custom_sdkconfig =
    CONFIG_SPI_FLASH_YIELD_DURING_ERASE=y
    CONFIG_LWIP_DHCP_GET_NTP_SRV=n
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

lib_compat_mode = strict
lib_ldf_mode = chain
lib_ignore =
    WebServer
    Zigbee                 ; ESP32-S3 projekt nie używa Zigbee; bundled Zigbee źródeł wymagają sdkconfig.h

lib_deps =
    bblanchon/ArduinoJson
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit TSL2561
    ESP32Async/AsyncTCP                 ; ← FIX: właściwy fork dla ESPAsyncWebServer 3.10.x
    ;   (poprzednio: mathieucarbou/AsyncTCP @ ^3.3.2 — zarchiwizowany Jan 2025, brak status() const)
    ESP32Async/ESPAsyncWebServer @ ^3.10.3
    mobizt/FirebaseClient @ ^2.2.9


; ── ENV 1: wgrywanie USB (pierwsze wgranie lub po crashu) ────────
[env:esp32-s3-n16r8]
extends = base


; ── ENV 2: wgrywanie OTA przez WiFi (po pierwszym wgraniu USB) ───
[env:esp32-s3-n16r8-ota]
extends = base

upload_protocol = espota
upload_port     = 192.168.100.108   ; lub IP z loga: 192.168.x.x
;upload_port     = 192.168.100.15   ; lub IP z loga: 192.168.x.x
upload_flags    =
    --auth=${sysenv.RYBY_OTA_PASSWORD}
    --timeout=30

; ── Jak używać OTA ────────────────────────────────────────────────
;
;  PlatformIO (VSCode):
;    Wybierz "esp32-s3-n16r8-ota" w pasku na dole, potem Upload (→)
;
;    Lub terminal:
;      pio run -e esp32-s3-n16r8-ota --target upload
;
;  Arduino IDE:
;    Narzędzia → Port → ryby-led-s3.local
;    Hasło: zmienna środowiskowa RYBY_OTA_PASSWORD (ta sama wartość co OTA_PASSWORD
;    w src/secrets.h). Windows, PowerShell, w tym samym oknie przed pio:
;      $env:RYBY_OTA_PASSWORD = "<hasło>"
;    (trwale: Ustawienia → zmienne środowiskowe użytkownika)
;
;  Jeśli mDNS nie działa — zmień upload_port na adres IP.
; ─────────────────────────────────────────────────────────────────
